name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit to deploy"
        required: true
        default: "main"

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      # --------------------------------------------------
      # Build information
      # --------------------------------------------------
      - name: Generate build information
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_ID=$(date -u +"%Y%m%d-%H%M%S")
          COMMIT=$(git rev-parse --short HEAD)

          if [ -n "$DEPLOY_TAG" ]; then
            VERSION="$DEPLOY_TAG"
          else
            VERSION="dev"
          fi

          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "commit": "$COMMIT",
            "build": "$BUILD_ID",
            "builtAt": "$BUILD_DATE"
          }
          EOF

          echo "Version: $VERSION"
          echo "Commit:  $COMMIT"
          echo "Build:   $BUILD_ID"
          echo "Built:   $BUILD_DATE"

          cat version.json

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
    
      - name: Deploy
        run: |
          echo "Deploying ref: ${{ inputs.ref }}"
          
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='public_results/' \
            --exclude='start_list/' \
            ./ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/cigachrono/" \
            -e "ssh -i ~/.ssh/deploy_key"
      # --------------------------------------------------
      # Verify
      # --------------------------------------------------
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cat /var/www/cigachrono/version.json"

      # --------------------------------------------------
      # Cleanup
      # --------------------------------------------------
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
